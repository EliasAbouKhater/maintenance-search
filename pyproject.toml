[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# Start with a sensible baseline; expand as the codebase matures.
select = ["E", "F", "W", "I"]
ignore = [
  "E501",   # line-length handled by formatter; some strings intentional
  "E701",   # multiple statements on one line — existing tabular style in filters
  "E702",   # multiple statements on one line (semicolon) — same reason
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
